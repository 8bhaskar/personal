<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bhaskar Garg - Contact">
    <title>Contact - Bhaskar Garg</title>
    <link rel="stylesheet" href="./static/css/main.css">
    <link rel="stylesheet" href="./static/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <a href="./index.html">BG</a>
            </div>
            <ul class="nav-links">
                <li><a href="./index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="./technical.html"><i class="fas fa-microchip"></i> Technical</a></li>
                <li><a href="./masti.html"><i class="fas fa-smile"></i> Masti</a></li>
                <li><a href="./contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content visible">
        <section class="section-header" data-aos="fade-up">
            <h2>Get in Touch</h2>
            <p>Let's connect and collaborate</p>
        </section>

        <div class="contact-container">
            <!-- Contact Information -->
            <div class="contact-info" data-aos="fade-right">
                <div class="info-card">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <!-- Edit email here -->
                    <p>bgarg@ee.iitr.ac.in</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-phone"></i>
                    <h3>Phone</h3>
                    <!-- Edit phone here -->
                    <p>+91 8222842347</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-map-marker-alt"></i>
                    <h3>Location</h3>
                    <!-- Edit location here -->
                    <p>Bangalore, India</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-clock"></i>
                    <h3>Availability</h3>
                    <!-- Edit availability here -->
                    <p>Mon-Fri: 9AM - 6PM PST</p>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form" data-aos="fade-left">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="cta-button">Send Message</button>
                </form>
            </div>
        </div>

        <!-- Social Media Links -->
        <div class="social-links" data-aos="fade-up">
            <h3>Connect with Me</h3>
            <div class="social-icons">
                <!-- Edit social media links here -->
                <a href="https://linkedin.com/in/bhaskargarg29" target="_blank" class="social-icon">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://github.com/8bhaskar" target="_blank" class="social-icon">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://twitter.com/bhaskargarg" target="_blank" class="social-icon">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://instagram.com/bhaskargarg" target="_blank" class="social-icon">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AOS.init({
                duration: 800,
                once: true
            });

            // Handle navigation
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    if (this.getAttribute('href').startsWith('./')) {
                        e.preventDefault();
                        const targetPage = this.getAttribute('href').substring(2);
                        window.location.href = targetPage;
                    }
                });
            });

            // Handle form submission
            const contactForm = document.getElementById('contactForm');
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                // Add your form submission logic here
                alert('Thank you for your message! I will get back to you soon.');
                contactForm.reset();
            });
        });
    </script>
</body>
</html>
