<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Bhaskar Garg">
    <title>Contact - Bhaskar Garg</title>
    <link rel="stylesheet" href="./static/css/main.css">
    <link rel="stylesheet" href="./static/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <a href="./index.html">BG</a>
            </div>
            <ul class="nav-links">
                <li><a href="./index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="./technical.html"><i class="fas fa-microchip"></i> Technical</a></li>
                <li><a href="./masti.html"><i class="fas fa-smile"></i> Masti</a></li>
                <li><a href="./contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content visible">
        <section class="section-header" data-aos="fade-up">
            <h2>Get in Touch</h2>
            <p>Let's connect and explore opportunities together</p>
        </section>

        <section class="contact-section" data-aos="fade-up">
            <div class="contact-info">
                <div class="contact-card" data-aos="fade-up">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <p>bhaskargarg2002@gmail.com</p>
                </div>
                <div class="contact-card" data-aos="fade-up" data-aos-delay="100">
                    <i class="fab fa-linkedin"></i>
                    <h3>LinkedIn</h3>
                    <p>Bhaskar Garg</p>
                </div>
                <div class="contact-card" data-aos="fade-up" data-aos-delay="200">
                    <i class="fab fa-github"></i>
                    <h3>GitHub</h3>
                    <p>@bhaskargarg</p>
                </div>
            </div>

            <form class="contact-form" data-aos="fade-up" data-aos-delay="300">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize AOS
            AOS.init({
                duration: 800,
                once: true
            });

            // Handle form submission
            const contactForm = document.querySelector('.contact-form');
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                // Add your form submission logic here
                alert('Thank you for your message! I will get back to you soon.');
                contactForm.reset();
            });

            // Handle navigation
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    if (this.getAttribute('href').startsWith('./')) {
                        e.preventDefault();
                        const targetPage = this.getAttribute('href').substring(2);
                        window.location.href = targetPage;
                    }
                });
            });
        });
    </script>
</body>
</html> 
</html>
