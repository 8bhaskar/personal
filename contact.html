<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Bhaskar Garg">
    <title>Contact - Bhaskar Garg</title>
    <link rel="stylesheet" href="./static/css/main.css">
    <link rel="stylesheet" href="./static/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <a href="./index.html">BG</a>
            </div>
            <ul class="nav-links">
                <li><a href="./index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="./technical.html"><i class="fas fa-microchip"></i> Technical</a></li>
                <li><a href="./masti.html"><i class="fas fa-smile"></i> Masti</a></li>
                <li><a href="./contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="section-header" data-aos="fade-up">
            <h2>Get in Touch</h2>
            <p>Let's connect and explore opportunities together</p>
        </section>

        <section class="contact-section" data-aos="fade-up">
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <p><a href="mailto:your.email@example.com">your.email@example.com</a></p>
                </div>
                <div class="contact-item">
                    <i class="fab fa-linkedin"></i>
                    <h3>LinkedIn</h3>
                    <p><a href="https://linkedin.com/in/yourprofile" target="_blank">linkedin.com/in/yourprofile</a></p>
                </div>
                <div class="contact-item">
                    <i class="fab fa-github"></i>
                    <h3>GitHub</h3>
                    <p><a href="https://github.com/yourusername" target="_blank">github.com/yourusername</a></p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AOS.init({
                duration: 800,
                once: true
            });
        });
    </script>
</body>
</html>
